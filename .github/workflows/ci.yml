# WURK CI — see docs/sprints/sprint-00.md §7.
#
#   Draft PR                 -> quick checks only (style, static analysis, types, lint)
#   PR ready for review      -> quick checks + tests + production build
#   Docs-only change         -> nothing runs except the summary job (passes immediately)
#   Push to main / develop   -> nothing (already verified on the PR)
#
# The "CI" summary job always runs and is the single required status check, so
# skipped jobs never block a merge and failed/cancelled jobs always do.

name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PHP_VERSION: '8.4'
  PHP_EXTENSIONS: mbstring, intl, pdo_sqlite, sqlite3, bcmath, zip, pcntl, redis, gd, exif

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/**'
            backend:
              - *shared
              - 'app/**'
              - 'bootstrap/**'
              - 'config/**'
              - 'database/**'
              - 'routes/**'
              - 'tests/**'
              - 'resources/views/**'
              - 'modules/**/*.php'
              - 'modules/**/module.json'
              - 'modules/**/*.stub'
              - 'modules/**/templates/**' # website templates: installed and switched by backend tests
              - 'composer.json'
              - 'composer.lock'
              - 'phpunit.xml'
              - 'phpstan.neon'
              - 'pint.json'
            frontend:
              - *shared
              - 'resources/js/**'
              - 'resources/css/**'
              - 'modules/**/*.ts'
              - 'modules/**/*.tsx'
              - 'modules/**/*.css'
              - 'modules/**/templates/**' # the template guard renders every template page
              - 'public/images/templates/**' # the guard checks every template photo exists
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'tsconfig.json'
              - 'eslint.config.js'
              - '.prettierrc.json'
              - 'e2e/**'
              - 'playwright.config.ts'
            docker:
              - *shared
              - 'docker/**'
              - 'compose.yaml'
              - '.dockerignore'
              - 'composer.lock'
              - 'pnpm-lock.yaml'

  backend-quick:
    name: Backend · style & static analysis
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - name: Composer cache
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Pint
        run: vendor/bin/pint --test
      - name: PHPStan cache
        uses: actions/cache@v6
        with:
          path: .phpstan-cache
          key: phpstan-${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: |
            phpstan-${{ github.event.pull_request.number }}-
            phpstan-
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github

  frontend-quick:
    name: Frontend · types, lint & format
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check

  backend-tests:
    name: Backend · tests
    needs: [changes, backend-quick]
    if: needs.changes.outputs.backend == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - name: Composer cache
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Pest
        run: vendor/bin/pest --parallel --compact

  backend-tests-mysql:
    name: Backend · tests on MySQL 8 (real shards)
    needs: [changes, backend-quick]
    if: needs.changes.outputs.backend == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 18 # ~8 min and growing with each sub-sprint
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wurk_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: wurk_test
      DB_USERNAME: root
      DB_PASSWORD: root
      TEST_SHARD_DRIVER: mysql
      TEST_SHARD_DATABASES: wurk_shard_1,wurk_shard_2
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Composer cache
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Create shard databases
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE wurk_shard_1; CREATE DATABASE wurk_shard_2;"
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Pest (MySQL, sequential — shards are shared databases)
        run: vendor/bin/pest --compact

  frontend-tests:
    name: Frontend · tests & build
    needs: [changes, frontend-quick]
    if: needs.changes.outputs.frontend == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vitest
        run: pnpm test
      - name: Production build
        run: pnpm build

  e2e:
    name: E2E · smoke & accessibility
    needs: [changes, backend-quick, frontend-quick]
    if: >-
      always() && !cancelled() && !contains(needs.*.result, 'failure')
      && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 454 browser checks plus the 24-template performance gate (~13 min and growing)
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - name: Composer cache
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare app (isolated .env.e2e with a business and its owner)
        run: |
          pnpm build         # first: setup publishes demo sites, which needs the website renderer
          ./scripts/e2e-setup
      - name: Playwright browser cache
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        env:
          APP_ENV: e2e
        run: pnpm test:e2e
      # Every template's public home page: mobile Lighthouse ≥ 90 and layout shift < 0.1 (Sprint 5 gate).
      - name: Performance gate (mobile Lighthouse on all 24 templates)
        env:
          APP_ENV: e2e
        run: |
          php artisan website:demo-sites --no-interaction
          php artisan serve --host=127.0.0.1 --port=8124 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8124/ && break; sleep 1; done
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" node scripts/performance-gate.mjs --port=8124
      - name: Summarise failures
        if: failure()
        run: node e2e/report-failures.mjs
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker-dev:
    name: Docker · dev image builds
    needs: changes
    if: needs.changes.outputs.docker == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build dev image (retries once on transient network failures)
        uses: docker/build-push-action@v7
        with:
          context: docker/dev
          load: false
          cache-from: type=gha,scope=wurk-dev
          cache-to: type=gha,scope=wurk-dev,mode=max

  docker-prod:
    name: Docker · production image
    needs: changes
    if: needs.changes.outputs.docker == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        run: |
          docker run --rm -i hadolint/hadolint:v2.15.1 hadolint --ignore DL3008 --format json - \
            < docker/production/Dockerfile > hadolint.json || true
          jq -r '.[] | "::error file=docker/production/Dockerfile,line=\(.line)::\(.code) \(.message)"' hadolint.json
          [ "$(jq length hadolint.json)" = "0" ]
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/production/Dockerfile
          tags: wurk:ci
          load: true
          cache-from: type=gha,scope=wurk-prod
          cache-to: type=gha,scope=wurk-prod,mode=max
      - name: Start container
        run: |
          docker run -d --name wurk -p 8000:8000 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e APP_URL=http://localhost:8000 \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=:memory: \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync \
            wurk:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health/live > /dev/null && break
            sleep 2
          done
      - name: Verify container
        run: |
          set -e
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8000$1"); echo "$1 -> $code"; [ "$code" = "$2" ]; }
          check /health/live 200
          check /health/ready 200
          check / 200
          check /_design 404
          uid=$(docker exec wurk id -u); echo "uid=$uid"; [ "$uid" != "0" ]
          if curl -sI http://localhost:8000/ | grep -qi '^x-powered-by'; then echo "X-Powered-By header leaked"; exit 1; fi
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' wurk); echo "health=$status"
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          [ "$status" = "healthy" ]
          # Server-side renderer for wurk.co.za: the same image in its "ssr" role.
          docker run -d --name wurk-ssr -p 13714:13714 wurk:ci ssr
          for i in $(seq 1 15); do
            out=$(curl -s -X POST http://localhost:13714/render -H 'Content-Type: application/json' \
              -d '{"component":"Marketing::Faq","props":{"signupUrl":"x","signInUrl":"y","moduleNames":{},"errors":{}},"url":"/faq","version":"1"}' || true)
            echo "$out" | grep -q 'Questions · WURK' && { echo "SSR renders pages"; break; }
            sleep 1
          done
          echo "$out" | grep -q 'Questions · WURK'
          docker image ls wurk:ci --format 'Image size: {{.Size}}'
      - name: Container logs
        if: failure()
        run: |
          docker logs wurk || true
          docker logs wurk-ssr || true

  ci:
    name: CI
    if: always()
    needs: [changes, backend-quick, frontend-quick, backend-tests, backend-tests-mysql, frontend-tests, e2e, docker-dev, docker-prod]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Summarise results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' > /dev/null; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed or were not needed for this change."
