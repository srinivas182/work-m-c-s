# WURK local development stack.  Start with:  ./scripts/dev up
name: wurk

services:
  app:
    build: docker/dev
    command: php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8000 --watch
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      VITE_DEV_SERVER_URL: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  vite:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      VITE_HOST: 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wurk
      MYSQL_USER: wurk
      MYSQL_PASSWORD: wurk
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql:/var/lib/mysql
      - ./docker/dev/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.13
    environment:
      MEILI_MASTER_KEY: local-dev-master-key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch:/meili_data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mysql:
  meilisearch:
  node_modules:
